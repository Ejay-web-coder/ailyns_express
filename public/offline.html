<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e92968" />
    <link rel="icon" type="image/png" href="/icons/favicon-48.png" />
    <title>You're offline · Ailyn's Express</title>
    <style>
      :root {
        --pink: #e92968;
        --wine: #5f0a27;
        --ink: #251a1e;
        --muted: #74676c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 85% 0%, #ffe3ea 0, transparent 45%), #fffafa;
        color: var(--ink);
        font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 380px;
      }
      img {
        width: 76px;
        height: 76px;
        border-radius: 22px 22px 22px 8px;
        box-shadow: 0 14px 30px rgba(204, 24, 82, 0.25);
      }
      h1 {
        margin: 26px 0 10px;
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 26px;
        color: var(--muted);
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        padding: 0 26px;
        border: 0;
        border-radius: 13px;
        background: linear-gradient(135deg, var(--pink), #d51d57);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 9px 22px rgba(222, 31, 94, 0.22);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Ailyn's Express" />
      <h1>You're offline</h1>
      <p>
        Ailyn's Express needs an internet connection to load menus, orders and live rider
        tracking. Check your connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
